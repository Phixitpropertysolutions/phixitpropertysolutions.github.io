<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PHIX-IT Property Maintenance</title>
<meta name="description" content="PHIX-IT Property Maintenance">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f5f7;
    color:#132238;
}

.card{
    width:100%;
    max-width:720px;
    padding:64px 40px;
    background:#ffffff;
    border-radius:18px;
    box-shadow:0 14px 40px rgba(15,23,42,.10);
    text-align:center;
}

.brand{
    margin:0;
    font-size:54px;
    letter-spacing:-2px;
    color:#102f4f;
}

.line{
    width:70px;
    height:4px;
    margin:22px auto;
    border-radius:4px;
    background:#38a9e8;
}

h2{
    margin:0 0 16px;
    font-size:25px;
    font-weight:600;
}

p{
    max-width:520px;
    margin:0 auto;
    color:#5d6b7a;
    font-size:18px;
    line-height:1.6;
}

footer{
    margin-top:44px;
    color:#8793a0;
    font-size:14px;
}

@media(max-width:600px){
    .card{
        padding:48px 24px;
    }

    .brand{
        font-size:44px;
    }

    h2{
        font-size:22px;
    }
}
</style>
</head>

<body>

<main class="card">
    <h1 class="brand">PHIX-IT</h1>
    <div class="line"></div>

    <h2>Property Maintenance & Repairs</h2>

    <p>
        Our new website is currently being prepared.
        Please check back soon.
    </p>

    <footer>
        © PHIX-IT Property Maintenance
    </footer>
</main>

</body>
</html>
